name: Build IPA

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        run: |
          set +e
          xcodebuild \
            -project PetCam.xcodeproj \
            -scheme PetCam \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1
          status=$?
          grep -E "(error|warning): " build.log | sort -u | head -150
          if [ $status -ne 0 ]; then
            echo "::error::xcodebuild failed"
            tail -80 build.log
            exit $status
          fi

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/PetCam.app Payload/
          zip -qry PetCam.ipa Payload
          ls -lh PetCam.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: PetCam-ipa
          path: PetCam.ipa

      - name: Publish rolling "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest PetCam.ipa \
            --title "PetCam (latest build)" \
            --notes "Unsigned build of ${GITHUB_SHA::7}. Install with iLoader." \
            --prerelease \
            --target "$GITHUB_SHA"
